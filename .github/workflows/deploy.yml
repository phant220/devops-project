name: CI/CD

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Vérifier la syntaxe Python
        run: python3 -m py_compile app/app.py

      - name: Build et déploiement
        run: |
          docker rm -f mon-app prometheus grafana || true
          docker compose up -d --build
          docker image prune -f

      - name: Vérifier que l'application répond
        run: |
          sleep 15
          curl -f http://localhost/health